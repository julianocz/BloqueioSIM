plugins { id 'com.android.application' }

// Número da versão = número da compilação no GitHub (Actions)
def numero = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def chave = file("chave.jks")

android {
    namespace 'com.juliano.bloqueiosim'
    compileSdk 34
    defaultConfig {
        applicationId 'com.juliano.bloqueiosim'
        minSdk 29
        targetSdk 34
        versionCode numero
        versionName "2." + numero
    }
    signingConfigs {
        fixa {
            storeFile chave
            storePassword 'bloqueiosim'
            keyAlias 'bloqueiosim'
            keyPassword 'bloqueiosim'
        }
    }
    buildTypes {
        debug { if (chave.exists()) signingConfig signingConfigs.fixa }
        release { minifyEnabled false }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
